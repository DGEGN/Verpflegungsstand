<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {

    --rust-bg: #FBEAE8;
    --led: #141419;
    --led-amber: #F5A623;
    --led-green: #35D07F;
    --led-grey: #7A7E88;

    --mon-bg: #F2F3F6;

    --mon-border: #E1E3E8;

  }

    --bg: #101014;
    --card: #1D1F26;
    --border: #2E313B;
    --navy: #3D6BA8;
    --navy-dark: #2C5088;
    --text: #EDEEF2;
    --muted: #9CA0AC;
    --mon-bg: #101014;
    --mon-card: #1D1F26;
    --mon-border: #2E313B;
    --mon-text: #EDEEF2;
    --mon-muted: #9CA0AC;
    --mon-nav-bg: #22242B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; font-weight: 700; margin: 0; }

  .nav-wrap { padding: 14px 16px 0; max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .nav { display: flex; gap: 4px; background: #E9EBEF; border-radius: 14px; padding: 4px; overflow-x: auto; flex: 1; }
  .nav a { flex: 1; text-align: center; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .nav a.active { background: var(--navy); color: #fff; }
  .monitor .nav-wrap { max-width: 100%; padding: 12px 16px 0; }
  .monitor .nav { background: var(--mon-nav-bg); }
  .monitor .nav a { color: var(--mon-muted); }
  .monitor .nav a.active { background: var(--led-amber); color: var(--led); }
  .theme-toggle { background: var(--mon-card); border: 1px solid var(--mon-border); color: var(--mon-text); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  h1.page-title { font-size: 22px; margin: 6px 0 16px; }
  h2.section-title { font-size: 15px; margin: 30px 0 12px; padding-top: 20px; border-top: 1px solid var(--border); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 14px; box-shadow: 0 1px 3px rgba(20,20,25,0.04);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .stepper button {

  .gesperrt-block { background: #FAFAFB; border: 1px dashed var(--border); border-radius: var(--radius-md); padding: 20px; text-align: center; color: var(--muted); font-size: 13px; }

  .bar {

  input, select { padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; background: #fff; color: var(--text); font-family: inherit; }

  .stat-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--green-bg); color: var(--green); font-weight: 700; font-size: 12.5px; padding: 6px 12px; border-radius: 20px; }

  .led-amber { color: var(--led-amber); }
  .led-green { color: var(--led-green); }

  /* Ausgaben-Kacheln (Küche) */

  .ausgabe-tile.geschlossen { opacity: 0.35; align-items: center; justify-content: center; text-align: center; }
  .banner-stack { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 0; max-width: 1200px; margin: 0 auto; }
  .update-banner { background: var(--rust); color: #fff; padding: 22px 28px; border-radius: 12px; font-size: 26px; font-weight: 800; box-shadow: 0 6px 18px rgba(0,0,0,0.3); text-align: center; }
  .ausgabe-tile-head { display: flex; justify-content: space-between; align-items: center; }
  .ausgabe-tile-nr { font-size: 15px; color: var(--mon-muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .ausgabe-toggle { background: var(--mon-border); border: none; color: var(--mon-muted); border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-weight: 600; }
  .ausgabe-toggle.on { background: var(--green); color: #fff; }
  .ausgabe-tile-num { font-size: 34px; color: var(--mon-text); font-weight: 700; font-family: 'Poppins', sans-serif; }
  .ausgabe-tile-time { font-size: 13px; color: var(--mon-muted); }
  .ausgabe-tile-time.warn { color: var(--led-amber); }
  .ausgabe-tile-time.late { color: var(--rust); }
  .t-items { list-style: none; margin: 0; padding: 0; flex: 1; }
  .t-items li { font-size: 15px; margin-bottom: 4px; }
  .t-items b { color: var(--led-amber); margin-right: 6px; }
  .t-hinweis { color: var(--rust); font-size: 14px; font-weight: 700; margin: 4px 0 0; }
  .ready-btn { width: 100%; background: transparent; border: 1px solid var(--led-amber); color: var(--led-amber); border-radius: 9px; padding: 10px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .ready-btn.sage { border-color: var(--led-green); color: var(--led-green); }
  .ready-btn.klein { padding: 7px; font-size: 12px; }

  .queue-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .queue-tile { flex: 0 0 180px; background: var(--mon-card); border: 1px solid var(--mon-border); border-radius: 12px; padding: 12px; }
  .queue-tile .q-nr { font-size: 18px; font-weight: 700; color: var(--mon-text); }
  .queue-tile .q-time { font-size: 11px; color: var(--mon-muted); }
  .queue-tile ul { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; color: var(--mon-muted); }

  .empty { text-align: center; color: var(--mon-muted); padding: 60px 20px; }
  .ausgabe-badge { display: inline-block; background: var(--led-amber); color: var(--led); font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 12px; margin-left: 6px; }
  .ausgabe-wait { display: inline-block; background: var(--mon-border); color: var(--mon-muted); font-size: 11px; padding: 2px 9px; border-radius: 12px; margin-left: 6px; }

  /* Ausgabemonitor: volle Breite, automatisch skalierend */
  .ausgabe-fullscreen { display: flex; flex-direction: column; gap: 0.7vh; padding: 0 1.2vw 1.2vh; }
  .ausgabe-tile-full {
    background: var(--mon-card); border: 1px solid var(--mon-border); border-radius: 16px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 3vw;
    transition: background 0.3s ease;
  }
  .ausgabe-tile-full.gross { font-weight: 700; }
  .ausgabe-tile-full.fertig-gruen { border-color: var(--led-green); border-width: 3px; background: color-mix(in srgb, var(--led-green) 30%, var(--mon-card)); }
  .ausgabe-tile-full .links { display: flex; align-items: baseline; gap: 1.2vw; }
  .status-tag { display: inline-block; font-weight: 700; padding: 0.3em 0.9em; border-radius: 999px; }
  .status-wartend { background: var(--mon-border); color: var(--mon-muted); }
  .status-inBearbeitung { background: var(--mon-border); color: var(--led-amber); }
  .status-fertig { background: var(--mon-border); color: var(--led-green); }
</style>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo, useRef } = React;

// Festes Admin-Passwort für die Artikelverwaltung. Vor dem Veröffentlichen
// anpassen — wer die index.html einsehen kann, sieht auch dieses Passwort,
// es schützt also nur vor versehentlichem Ändern durch Kassenpersonal,
// nicht vor absichtlichem Zugriff.
const ADMIN_PASSWORT = "Kuckuck2026";

// Einfaches Passwort für den Zugriff auf den Kasse-Reiter (kein Konto, nur
// ein gemeinsames Passwort fürs Kassenpersonal). Vor dem Einsatz anpassen.
const KASSE_PASSWORT = "Kinderfest2026";

const KATEGORIEN = [
  { id: "essen", label: "Essen" },
  { id: "alkoholfrei", label: "Alkoholfreie Getränke" },
  { id: "alkoholisch", label: "Alkoholisches" },
  { id: "pfand", label: "Pfand" },
];
const katLabel = (id) => (KATEGORIEN.find((k) => k.id === id) || {}).label || id;

const ANZAHL_AUSGABEN = 3;
const EINSTELLUNGEN_STANDARD = { ausgabe1: true, ausgabe2: true, ausgabe3: true, essenBesetzt: true, getraenkeBesetzt: true, bestandsverwaltungAktiv: false };
const SCHEINE = [500, 200, 100, 50, 20, 10, 5];
const MUENZEN = [2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];
const formatStueckelung = (wert) => (wert >= 1 ? wert + " €" : Math.round(wert * 100) + " Ct");

// Hell/Dunkel-Modus wird pro Gerät im Browser gespeichert (localStorage) —
// jeder Bildschirm (Kasse, Essen-Monitor, Ausgabemonitor …) kann seine
// eigene Einstellung behalten.
function useTheme() {
  const [dunkel, setDunkel] = useState(() => localStorage.getItem("kuechenmonitor-theme") === "dunkel");
  useEffect(() => {
    document.body.classList.toggle("dunkel", dunkel);
    localStorage.setItem("kuechenmonitor-theme", dunkel ? "dunkel" : "hell");
  }, [dunkel]);
  return [dunkel, setDunkel];
}
function ThemeToggle({ dunkel, setDunkel }) {
  return (
    <button type="button" className="theme-toggle" onClick={() => setDunkel((v) => !v)} title="Hell/Dunkel umschalten">
      {dunkel ? "☀️ Hell" : "🌙 Dunkel"}
    </button>
  );
}

function useFullscreen() {
  const [voll, setVoll] = useState(!!document.fullscreenElement);
  useEffect(() => {
    const onChange = () => setVoll(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", onChange);
    return () => document.removeEventListener("fullscreenchange", onChange);
  }, []);
  const umschalten = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  return [voll, umschalten];
}
function FullscreenToggle() {
  const [voll, umschalten] = useFullscreen();
  return (
    <button type="button" className="theme-toggle" onClick={umschalten} title="Vollbild umschalten">
      {voll ? "⤢ Vollbild verlassen" : "⛶ Vollbild"}
    </button>
  );
}

function zeitKlasse(elapsedMs) {
  const mins = elapsedMs / 60000;
  if (mins >= 7) return "late";
  if (mins >= 4) return "warn";
  return "";
}

function essenStatusLabel(s) {
  return { wartend: "Wartend", inBearbeitung: "In Bearbeitung", fertig: "Fertig" }[s] || s;
}

function formatElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ":" + (s % 60).toString().padStart(2, "0");
}

function istAktiv(b) { return !b.storniert && !b.archiviert; }

function orderStatusText(b) {
  if (b.storniert) return "Storniert";
  if (b.archiviert) return "Abgeschlossen";
  const teile = [b.zahlungsart === "karte" ? "Karte" : "Bar"];
  if (b.hatGetraenke) teile.push("Getränke: " + (b.getraenkeAbgeholt ? "abgeholt" : b.getraenkeFertig ? "fertig" : "offen"));
  if (b.hatEssen) {
    let t = "Essen: " + essenStatusLabel(b.essenStatus);
    if (b.ausgabeNummer) t += " (Ausgabe " + b.ausgabeNummer + ")";
    teile.push(t);
  }
  return teile.join(" · ") || "offen";
}

// Gesamtstatus einer Bestellung: "Fertig" gilt nur, wenn ALLE enthaltenen
// Bereiche (Essen UND Getränke, falls vorhanden) fertig sind — nicht schon,
// wenn nur einer von beiden fertig ist.
function gesamtStatus(b) {
  if (b.storniert) return "storniert";
  if (b.archiviert) return "abgeschlossen";
  const essenOk = !b.hatEssen || b.essenStatus === "fertig";
  const getraenkeOk = !b.hatGetraenke || b.getraenkeFertig;
  if (essenOk && getraenkeOk) return "fertig";
  if ((b.hatEssen && b.essenStatus === "fertig") || (b.hatGetraenke && b.getraenkeFertig)) return "teilweiseFertig";
  return "offen";
}
function gesamtStatusLabel(s) {
  return { fertig: "Fertig", teilweiseFertig: "Teilweise fertig", offen: "Offen", storniert: "Storniert", abgeschlossen: "Abgeschlossen" }[s] || s;
}

// Setzt ein Update auf einer Bestellung und archiviert sie erst dann
// vollständig, wenn sowohl der Essens- als auch der Getränke-Teil (falls
// jeweils vorhanden) tatsächlich abgeholt wurden.
async function updateUndPruefeArchivierung(bestellung, patch) {
  const { doc, updateDoc } = window.__fs;
  const essenAbgeholt = "essenAbgeholt" in patch ? patch.essenAbgeholt : bestellung.essenAbgeholt;
  const getraenkeAbgeholt = "getraenkeAbgeholt" in patch ? patch.getraenkeAbgeholt : bestellung.getraenkeAbgeholt;
  const essenOk = !bestellung.hatEssen || essenAbgeholt;
  const getraenkeOk = !bestellung.hatGetraenke || getraenkeAbgeholt;
  const vollstaendig = essenOk && getraenkeOk;
  await updateDoc(doc(window.__db, "bestellungen", bestellung.id), {
    ...patch,
    ...(vollstaendig ? { archiviert: true } : {}),
  });
}

function formatUhrzeit(ms) {
  if (!ms) return null;
  return new Date(ms).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function formatZeitstempel(b) {
  const teile = ["Bestellt: " + (formatUhrzeit(b.erstelltAmMs) || "–")];
  if (b.hatEssen) teile.push("Essen fertig: " + (formatUhrzeit(b.essenFertigZeitMs) || "–"));
  if (b.hatGetraenke) teile.push("Getränke fertig: " + (formatUhrzeit(b.getraenkeFertigZeitMs) || "–"));
  teile.push("Abgeschlossen: " + (formatUhrzeit(b.abschlussZeitMs) || "–"));
  return teile.join(" · ");
}

  return ready;
}

// Vergibt fortlaufende Bestellnummern beginnend bei 1. Läuft als Firestore-
// Transaktion, damit auch bei mehreren gleichzeitig tippenden Kassen jede
// Nummer nur einmal vergeben wird.
async function naechsteBestellnummer() {
  const { doc, runTransaction } = window.__fs;
  const ref = doc(window.__db, "einstellungen", "zaehler");
  return runTransaction(window.__db, async (tx) => {
    const snap = await tx.get(ref);
    const aktuell = snap.exists() && snap.data().naechsteNummer ? snap.data().naechsteNummer : 1;
    tx.set(ref, { naechsteNummer: aktuell + 1 }, { merge: true });
    return aktuell;
  });
}

function heutigesLabel() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function startHeuteMs() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

// Läuft dauerhaft im Hintergrund (App-Komponente): sobald der Kalendertag
// wechselt (Nachtsprung 00 Uhr), werden Bestellnummer und Chronik-Zähltag
// automatisch zurückgesetzt — auch ohne manuellen Kassenschnitt. Der
// Kassenbuch-Bestand bleibt davon unberührt (der wird nur per Kassenschnitt
// oder manuellem Zurücksetzen abgeschlossen).
function useMitternachtsReset(ready) {
  useEffect(() => {
    if (!ready) return;
    let letztesLabel = null;
    const { doc, onSnapshot, setDoc } = window.__fs;
    const ref = doc(window.__db, "einstellungen", "verkaufstag");
    const unsub = onSnapshot(ref, (snap) => {
      letztesLabel = snap.exists() ? snap.data().tagLabel : null;
    });
    const intervall = setInterval(async () => {
      const heute = heutigesLabel();
      if (letztesLabel && letztesLabel === heute) return;
      if (letztesLabel === null) return; // noch nicht geladen
      // Tageswechsel erkannt: Bestellnummer + Chronik-Tag zurücksetzen
      await setDoc(doc(window.__db, "einstellungen", "verkaufstag"), { tagStartMs: startHeuteMs(), tagLabel: heute }, { merge: true });
      await setDoc(doc(window.__db, "einstellungen", "zaehler"), { naechsteNummer: 1 }, { merge: true });
    }, 60000);
    // beim ersten Laden: falls noch gar kein Verkaufstag existiert, anlegen
    (async () => {
      await new Promise((r) => setTimeout(r, 1500));
      if (letztesLabel === null) {
        await setDoc(doc(window.__db, "einstellungen", "verkaufstag"), { tagStartMs: startHeuteMs(), tagLabel: heutigesLabel() }, { merge: true });
      }
    })();
    return () => { clearInterval(intervall); unsub(); };
  }, [ready]);
}

// Kassenschnitt: schließt den aktuellen Verkaufszeitraum ab, speichert eine
// Zusammenfassung zur Nachvollziehbarkeit und setzt Kassenbuch, Chronik und
// Bestellnummer neu — wie der Tagesabschluss an einem EC-Gerät.
async function kassenschnittDurchfuehren(bestellungen, kassenbuchBestand, zurueckgesetztAm) {
  const { collection, doc, addDoc, setDoc } = window.__fs;
  const relevant = bestellungen.filter((b) => !b.storniert && (b.erstelltAmMs || 0) >= zurueckgesetztAm && !b.personalverpflegung);
  const bar = relevant.filter((b) => (b.zahlungsart || "bar") === "bar");
  const karte = relevant.filter((b) => b.zahlungsart === "karte");
  const proKategorie = {};
  relevant.forEach((b) => b.items.forEach((i) => {
    proKategorie[i.kategorie] = (proKategorie[i.kategorie] || 0) + i.preis * i.menge;
  }));
  const jetzt = Date.now();
  await addDoc(collection(window.__db, "kassenschnitte"), {
    erstelltAmMs: jetzt,
    zeitraumVonMs: zurueckgesetztAm,
    zeitraumBisMs: jetzt,
    anzahlBestellungen: relevant.length,
    anzahlStorniert: bestellungen.filter((b) => b.storniert && (b.erstelltAmMs || 0) >= zurueckgesetztAm).length,
    bareinnahmen: bar.reduce((s, b) => s + b.gesamtpreis, 0),
    karteneinnahmen: karte.reduce((s, b) => s + b.gesamtpreis, 0),
    proKategorie,
    kassenbuchBestand,
  });
  await setDoc(doc(window.__db, "einstellungen", "kassenbuch"), { zurueckgesetztAm: jetzt }, { merge: true });
  await setDoc(doc(window.__db, "einstellungen", "verkaufstag"), { tagStartMs: jetzt, tagLabel: heutigesLabel() }, { merge: true });
  await setDoc(doc(window.__db, "einstellungen", "zaehler"), { naechsteNummer: 1 }, { merge: true });
}

// Weist wartenden Essens-Bestellungen automatisch eine freie, geöffnete Ausgabe
// (1-3) zu, sobald eine frei wird. Läuft im Essen-Monitor und Ausgabemonitor.
function useAusgabenZuweisung(bestellungen, ready, einstellungen) {
  useEffect(() => {
    if (!ready || !einstellungen.essenBesetzt) return;
    const offeneNummern = [1, 2, 3].filter((n) => einstellungen["ausgabe" + n]);
    if (offeneNummern.length === 0) return;
    const aktiv = bestellungen.filter(istAktiv);
    const belegt = new Set(
      aktiv.filter((b) => !b.essenAbgeholt && (b.essenStatus === "inBearbeitung" || b.essenStatus === "fertig")).map((b) => b.ausgabeNummer)
    );
    const frei = offeneNummern.filter((n) => !belegt.has(n));
    if (frei.length === 0) return;
    const wartend = aktiv
      .filter((b) => b.essenStatus === "wartend")
      .sort((a, b) => (a.erstelltAmMs || 0) - (b.erstelltAmMs || 0));
    const zuWeisen = wartend.slice(0, frei.length);
    if (zuWeisen.length === 0) return;
    const { doc, updateDoc } = window.__fs;
    zuWeisen.forEach((b, idx) => {
      updateDoc(doc(window.__db, "bestellungen", b.id), {
        essenStatus: "inBearbeitung",
        ausgabeNummer: frei[idx],
        essenInBearbeitungZeitMs: Date.now(),
      }).catch(() => {});
    });
  }, [bestellungen, ready, einstellungen]);
}

// Erzeugt SVG-Markup für einen QR-Code aus einem Text (per qrcode-generator CDN-Lib).
function erzeugeQrSvg(text, zellgroesse) {
  try {
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    return qr.createSvgTag({ cellSize: zellgroesse || 6, margin: 4 });
  } catch (e) {
    return "";
  }
}

// Baut den Beleg-Text (für QR-Code und Anzeige) aus einer Bestellung.
function belegText(b) {
  const zeilen = [
    "Kuckucks-Bähnel",
    "Bestellung Nr. " + b.nummer,
    ...b.items.map((i) => i.menge + "x " + i.name + " " + (i.preis * i.menge).toFixed(2) + " €"),
    "---",
    "Gesamt: " + b.gesamtpreis.toFixed(2) + " €",
  ];
  if (b.hinweis) zeilen.push("Hinweis: " + b.hinweis);
  return zeilen.join("\n");
}

function Artikelverwaltung() {
  const ready = useFirebaseReady();

  const [editName, setEditName] = useState("");

  const [editKategorie, setEditKategorie] = useState("essen");
  const [editBestand, setEditBestand] = useState("");

  const unlock = () => {
    if (pwInput === ADMIN_PASSWORT) { setAdmin(true); setPwError(""); setPwInput(""); }
    else setPwError("Falsches Passwort.");
  };

  const add = async () => {
    if (!name.trim() || !preis) { setError("Name und Preis eintragen."); return; }
    setError("");
    const { collection, addDoc } = window.__fs;
    await addDoc(collection(window.__db, "artikel"), {
      name: name.trim(), preis: parseFloat(preis.replace(",", ".")), kategorie, ausverkauft: false,
      bestand: startBestand ? parseInt(startBestand, 10) || 0 : 0,
      bestandVerfolgt: true,
    });
    setName(""); setPreis(""); setStartBestand("");
  };

  const remove = async (id) => {
    const { doc, deleteDoc } = window.__fs;
    await deleteDoc(doc(window.__db, "artikel", id));
  };

  const toggleAusverkauft = async (a) => {
    const { doc, updateDoc } = window.__fs;
    await updateDoc(doc(window.__db, "artikel", a.id), { ausverkauft: !a.ausverkauft });
  };

  const toggleBestandVerfolgt = async (a) => {
    const { doc, updateDoc } = window.__fs;
    await updateDoc(doc(window.__db, "artikel", a.id), { bestandVerfolgt: !(a.bestandVerfolgt !== false) });
  };

  const startEdit = (a) => {
    setEditId(a.id); setEditName(a.name); setEditPreis(String(a.preis).replace(".", ",")); setEditKategorie(a.kategorie);
    setEditBestand(String(a.bestand || 0));

  const saveEdit = async (id) => {
    if (!editName.trim() || !editPreis) { setError("Name und Preis eintragen."); return; }
    setError("");
    const { doc, updateDoc } = window.__fs;
    await updateDoc(doc(window.__db, "artikel", id), {
      name: editName.trim(), preis: parseFloat(editPreis.replace(",", ".")), kategorie: editKategorie,
      bestand: parseInt(editBestand, 10) || 0,

    <div className="wrap">
      <h1 className="page-title">Artikelverwaltung</h1>

      {!admin && (
        <div className="row-form">
          <input type="password" placeholder="Admin-Passwort" value={pwInput}
            onChange={(e) => setPwInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && unlock()} style={{ width: 180 }} />
          <button className="btn" onClick={unlock}>Entsperren</button>
          {pwError && <span style={{ color: "var(--rust)", fontSize: 13 }}>{pwError}</span>}
        </div>
      )}

      {admin && (
        <>
          <div className="row-form">
            <span style={{ fontSize: 13 }}>Bestandsverwaltung (Mengen je Artikel):</span>
            <button className="btn small" style={einstellungen.bestandsverwaltungAktiv ? { background: "var(--green)" } : {}}
              onClick={() => setEinstellung({ bestandsverwaltungAktiv: !einstellungen.bestandsverwaltungAktiv })}>
              {einstellungen.bestandsverwaltungAktiv ? "Aktiv" : "Inaktiv"}
            </button>
          </div>
          <div className="row-form">
            <input placeholder="Artikelname" value={name} onChange={(e) => setName(e.target.value)} />
            <input placeholder="Preis (z.B. 3,50)" value={preis} onChange={(e) => setPreis(e.target.value)} style={{ width: 120 }} />
            <select value={kategorie} onChange={(e) => setKategorie(e.target.value)}>

            </select>
            {einstellungen.bestandsverwaltungAktiv && (

function Notenrechner({ onErfassen, buttonLabel }) {
  const [counts, setCounts] = useState({});
  const alle = [...SCHEINE.map((w) => ({ wert: w, typ: "schein" })), ...MUENZEN.map((w) => ({ wert: w, typ: "muenze" }))];
  const summe = alle.reduce((s, d) => s + (counts[d.wert] || 0) * d.wert, 0);
  const setCount = (wert, val) => setCounts((prev) => ({ ...prev, [wert]: Math.max(0, parseInt(val, 10) || 0) }));
  const aufschluesselung = () => alle.filter((d) => (counts[d.wert] || 0) > 0)
    .map((d) => (counts[d.wert]) + "× " + formatStueckelung(d.wert)).join(", ");
  const reset = () => setCounts({});

  return (
    <div>

            <input type="number" min="0" inputMode="numeric" value={counts[w] || ""} onChange={(e) => setCount(w, e.target.value)} placeholder="0" />
          </div>
        ))}
      </div>
      <div style={{ fontSize: 12, color: "var(--muted)", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", margin: "4px 0" }}>Münzen</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(78px,1fr))", gap: 8, marginBottom: 14 }}>
        {MUENZEN.map((w) => (
          <div key={w} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            <label style={{ fontSize: 12, color: "var(--muted)" }}>{formatStueckelung(w)}</label>
            <input type="number" min="0" inputMode="numeric" value={counts[w] || ""} onChange={(e) => setCount(w, e.target.value)} placeholder="0" />
          </div>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <span>Summe: <b style={{ fontSize: 18 }}>{summe.toFixed(2)} €</b></span>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn secondary" onClick={reset} type="button">Zurücksetzen</button>
          <button className="btn" disabled={summe <= 0} onClick={() => { onErfassen(summe, aufschluesselung()); reset(); }} type="button">{buttonLabel}</button>
        </div>
      </div>
    </div>
  );
}

function Kassenbuch() {
  const ready = useFirebaseReady();
  const alleEintraege = useKassenbuchEintraege();
  const zurueckgesetztAm = useKassenbuchEinstellung();
  const { bestellungen } = useBestellungen();
  const [entsperrt, setEntsperrt] = useState(false);
  const [kassePwInput, setKassePwInput] = useState("");
  const [kassePwError, setKassePwError] = useState("");
  const [art, setArt] = useState("einzahlung");
  const [betrag, setBetrag] = useState("");
  const [notiz, setNotiz] = useState("");
  const [error, setError] = useState("");
  const [zeigeVorverkauf, setZeigeVorverkauf] = useState(false);
  const [zeigeNachbestand, setZeigeNachbestand] = useState(false);
  const [zeigeBarListe, setZeigeBarListe] = useState(false);

  const eintraege = useMemo(
    () => alleEintraege.filter((e) => (e.erstelltAmMs || 0) >= zurueckgesetztAm),
    [alleEintraege, zurueckgesetztAm]
  );

  const barBestellungen = useMemo(
    () => bestellungen.filter((b) => !b.storniert && !b.personalverpflegung && (b.zahlungsart || "bar") === "bar" && (b.erstelltAmMs || 0) >= zurueckgesetztAm),
    [bestellungen, zurueckgesetztAm]
  );
  const kartenBestellungen = useMemo(
    () => bestellungen.filter((b) => !b.storniert && !b.personalverpflegung && b.zahlungsart === "karte" && (b.erstelltAmMs || 0) >= zurueckgesetztAm),
    [bestellungen, zurueckgesetztAm]
  );
  const personalBestellungen = useMemo(
    () => bestellungen.filter((b) => !b.storniert && b.personalverpflegung && (b.erstelltAmMs || 0) >= zurueckgesetztAm),
    [bestellungen, zurueckgesetztAm]
  );
  const bareinnahmen = barBestellungen.reduce((s, b) => s + b.gesamtpreis, 0);
  const karteneinnahmen = kartenBestellungen.reduce((s, b) => s + b.gesamtpreis, 0);

  const manuelleSumme = eintraege.filter((e) => e.art !== "nachbestand").reduce((sum, e) => {
    if (e.art === "auszahlung") return sum - e.betrag;
    return sum + e.betrag;
  }, 0);
  const bestand = manuelleSumme + bareinnahmen;

  const nachbestandEintraege = eintraege.filter((e) => e.art === "nachbestand");
  const letzterNachbestand = nachbestandEintraege.length ? nachbestandEintraege[nachbestandEintraege.length - 1] : null;
  const differenz = letzterNachbestand ? letzterNachbestand.betrag - bestand : null;

  const artLabel = (a) => ({ anfangsbestand: "Anfangsbestand", einzahlung: "Einzahlung", auszahlung: "Auszahlung", nachbestand: "Nachbestand (Zählung)" }[a] || a);

  const neuerEintrag = async (art, betrag, notiz) => {
    const { collection, addDoc, serverTimestamp } = window.__fs;
    await addDoc(collection(window.__db, "kassenbuch"), {
      art, betrag, notiz: notiz || "", erstelltAm: serverTimestamp(), erstelltAmMs: Date.now(),
    });
  };

  const eintragen = async () => {
    const zahl = parseFloat(betrag.replace(",", "."));
    if (!betrag || isNaN(zahl) || zahl <= 0) { setError("Bitte einen gültigen Betrag eintragen."); return; }
    setError("");
    await neuerEintrag(art, zahl, notiz.trim());
    setBetrag(""); setNotiz("");
  };

  const kassenschnitte = useKassenschnitte();
  const [schnittLaeuft, setSchnittLaeuft] = useState(false);
  const [zeigeHistorie, setZeigeHistorie] = useState(false);

  const kassenschnitt = async () => {
    if (!window.confirm("Kassenschnitt durchführen? Der bisherige Verkaufszeitraum wird als Bericht gespeichert und abgeschlossen. Kassenbuch, Chronik und Bestellnummern beginnen danach neu bei 0 bzw. 1.")) return;
    setSchnittLaeuft(true);
    try {
      await kassenschnittDurchfuehren(bestellungen, bestand, zurueckgesetztAm);
    } finally {
      setSchnittLaeuft(false);
    }
  };

  const neuerTag = async () => {
    if (!window.confirm("Kassenbuch wirklich zurücksetzen und mit einem neuen Anfangsbestand starten? Die bisherigen Einträge bleiben erhalten, zählen aber nicht mehr zum aktuellen Bestand.")) return;
    const { doc, setDoc } = window.__fs;
    await setDoc(doc(window.__db, "einstellungen", "kassenbuch"), { zurueckgesetztAm: Date.now() }, { merge: true });
  };

  if (!entsperrt) {
    return (
      <div className="wrap">
        <h1 className="page-title">Kassenbuch gesperrt</h1>
        <p style={{ color: "var(--muted)", fontSize: 13 }}>Bitte Passwort eingeben, um auf das Kassenbuch zuzugreifen.</p>
        <div className="row-form">
          <input type="password" placeholder="Passwort" value={kassePwInput}
            onChange={(e) => setKassePwInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && (kassePwInput === KASSE_PASSWORT ? setEntsperrt(true) : setKassePwError("Falsches Passwort."))}
            style={{ width: 180 }} />
          <button className="btn" onClick={() => (kassePwInput === KASSE_PASSWORT ? setEntsperrt(true) : setKassePwError("Falsches Passwort."))}>Entsperren</button>
          {kassePwError && <span style={{ color: "var(--rust)", fontSize: 13 }}>{kassePwError}</span>}
        </div>
      </div>
    );
  }

  return (
    <div className="wrap">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h1 className="page-title" style={{ margin: 0 }}>Kassenbuch</h1>
        <FullscreenToggle />
      </div>
      {!ready && <p>Verbinde mit Firebase…</p>}

      <div className="card" style={{ marginBottom: 20, textAlign: "center", padding: 22 }}>
        <div style={{ fontSize: 12, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 700 }}>Aktueller Bestand (Soll)</div>
        <div style={{ fontSize: 34, fontFamily: "'Poppins', sans-serif", fontWeight: 700, color: "var(--navy)" }}>{bestand.toFixed(2)} €</div>
        {letzterNachbestand && (
          <div style={{ marginTop: 10, fontSize: 13, color: differenz === 0 ? "var(--muted)" : differenz > 0 ? "var(--green)" : "var(--rust)" }}>
            Letzter gezählter Nachbestand: <b>{letzterNachbestand.betrag.toFixed(2)} €</b> — Differenz: <b>{differenz > 0 ? "+" : ""}{differenz.toFixed(2)} €</b> {differenz > 0 ? "(Überschuss)" : differenz < 0 ? "(Unterschuss)" : ""}
          </div>
        )}
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, fontSize: 14 }}>
          <span>Bareinnahmen aus {barBestellungen.length} Bestellungen: <b>{bareinnahmen.toFixed(2)} €</b></span>
          <button className="edit-link" onClick={() => setZeigeBarListe((v) => !v)}>{zeigeBarListe ? "Ausblenden" : "Bestellungen anzeigen"}</button>
        </div>
        <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 4 }}>
          Kartenzahlungen aus {kartenBestellungen.length} Bestellungen: <b>{karteneinnahmen.toFixed(2)} €</b> (nicht im Bargeldbestand enthalten)
        </div>
        {personalBestellungen.length > 0 && (
          <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 4 }}>
            Personalverpflegung: {personalBestellungen.length} Bestellungen (0 € Umsatz, nicht im Bestand enthalten)
          </div>
        )}
        {zeigeBarListe && (
          <div style={{ marginTop: 10, maxHeight: 220, overflowY: "auto" }}>
            {barBestellungen.length === 0 && <p style={{ color: "var(--muted)", fontSize: 13 }}>Keine Bar-Bestellungen seit dem letzten Zurücksetzen.</p>}
            {barBestellungen.slice().reverse().map((b) => (
              <div className="order-row" key={b.id} style={{ padding: "6px 0" }}>
                <span>Nr. {b.nummer} <span className="meta">· {new Date(b.erstelltAmMs).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}</span></span>
                <span><b>{b.gesamtpreis.toFixed(2)} €</b></span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="row-form">
        <select value={art} onChange={(e) => setArt(e.target.value)}>
          <option value="anfangsbestand">Anfangsbestand</option>
          <option value="einzahlung">Einzahlung</option>
          <option value="auszahlung">Auszahlung</option>
        </select>
        <input placeholder="Betrag (z.B. 20,00)" value={betrag} onChange={(e) => setBetrag(e.target.value)} style={{ width: 130 }} />
        <input placeholder="Notiz (optional)" value={notiz} onChange={(e) => setNotiz(e.target.value)} style={{ flex: 1, minWidth: 140 }} />
        <button className="btn" onClick={eintragen}>Eintragen</button>
      </div>
      {error && <p style={{ color: "var(--rust)", fontSize: 13 }}>{error}</p>}

      <h2 className="section-title">Vorverkaufbestand mit Scheinen/Münzen erfassen</h2>
      {!zeigeVorverkauf ? (
        <button className="btn secondary" onClick={() => setZeigeVorverkauf(true)}>Anfangsbestand zählen</button>
      ) : (
        <div className="card">
          <Notenrechner buttonLabel="Als Anfangsbestand buchen" onErfassen={(summe, aufschluesselung) => {
            neuerEintrag("anfangsbestand", summe, "Gezählt: " + aufschluesselung);
            setZeigeVorverkauf(false);
          }} />
        </div>
      )}

      <h2 className="section-title">Nachbestand erfassen</h2>
      <p style={{ color: "var(--muted)", fontSize: 13, marginTop: -4 }}>Zählung am Ende — wird nur zum Vergleich mit dem Soll-Bestand gespeichert, nicht mitgerechnet.</p>
      {!zeigeNachbestand ? (
        <button className="btn secondary" onClick={() => setZeigeNachbestand(true)}>Nachbestand zählen</button>
      ) : (
        <div className="card">
          <Notenrechner buttonLabel="Als Nachbestand buchen" onErfassen={(summe, aufschluesselung) => {
            neuerEintrag("nachbestand", summe, "Gezählt: " + aufschluesselung);
            setZeigeNachbestand(false);
          }} />
        </div>
      )}

      <h2 className="section-title">Einträge</h2>
      {eintraege.length === 0 && <p style={{ color: "var(--muted)", fontSize: 13 }}>Noch keine Einträge seit dem letzten Zurücksetzen.</p>}
      {eintraege.slice().reverse().map((e) => (
        <div className="order-row" key={e.id}>
          <span>
            <b>{e.art === "auszahlung" ? "−" : e.art === "nachbestand" ? "" : "+"}{e.betrag.toFixed(2)} €</b>
            <span className="meta"> · {artLabel(e.art)}{e.notiz ? " · " + e.notiz : ""}</span>
          </span>
        </div>
      ))}

      <h2 className="section-title">Kassenschnitt</h2>
      <p style={{ color: "var(--muted)", fontSize: 13 }}>
        Schließt den aktuellen Verkaufszeitraum ab (wie der Tagesabschluss an einem EC-Gerät): Bareinnahmen, Kartenumsatz und Kategorien werden als Bericht gespeichert, Kassenbuch-Bestand, Chronik und Bestellnummern starten danach neu.
      </p>
      <button className="btn" onClick={kassenschnitt} disabled={schnittLaeuft}>{schnittLaeuft ? "Wird erstellt…" : "Kassenschnitt durchführen"}</button>
      {" "}
      <button className="edit-link" onClick={() => setZeigeHistorie((v) => !v)}>{zeigeHistorie ? "Historie ausblenden" : "Bisherige Kassenschnitte anzeigen"}</button>
      {zeigeHistorie && (
        <div style={{ marginTop: 12 }}>
          {kassenschnitte.length === 0 && <p style={{ color: "var(--muted)", fontSize: 13 }}>Noch kein Kassenschnitt durchgeführt.</p>}
          {kassenschnitte.map((k) => (
            <div className="card" key={k.id} style={{ marginBottom: 10, fontSize: 13 }}>
              <div style={{ fontWeight: 700, marginBottom: 4 }}>{new Date(k.erstelltAmMs).toLocaleString("de-DE")}</div>
              <div>Bestellungen: {k.anzahlBestellungen} (storniert: {k.anzahlStorniert}) · Bar: {k.bareinnahmen.toFixed(2)} € · Karte: {k.karteneinnahmen.toFixed(2)} €</div>
              <div style={{ color: "var(--muted)" }}>
                {Object.entries(k.proKategorie || {}).map(([kat, wert]) => katLabel(kat) + ": " + wert.toFixed(2) + " €").join(" · ")}
              </div>
              <div style={{ color: "var(--muted)" }}>Kassenbuch-Bestand bei Abschluss: {k.kassenbuchBestand.toFixed(2)} €</div>
            </div>
          ))}
        </div>
      )}

      <h2 className="section-title">Kassenbuch-Bestand manuell zurücksetzen</h2>
      <p style={{ color: "var(--muted)", fontSize: 13 }}>
        Setzt nur den Kassenbuch-Bestand zurück, ohne vollständigen Kassenschnitt (z.B. für eine Zwischenzählung). Alte Einträge bleiben erhalten.
      </p>
      <button className="btn secondary" onClick={neuerTag}>Kassenbuch zurücksetzen</button>
    </div>
  );
}

function Kasse() {
  const ready = useFirebaseReady();
  const artikel = useArtikel();
  const { bestellungen } = useBestellungen();
  const einstellungen = useEinstellungen();
  const [entsperrt, setEntsperrt] = useState(false);
  const [kassePwInput, setKassePwInput] = useState("");
  const [kassePwError, setKassePwError] = useState("");
  const [cart, setCart] = useState({});
  const [gegeben, setGegeben] = useState("");
  const [rabatt, setRabatt] = useState("");
  const [personalverpflegung, setPersonalverpflegung] = useState(false);
  const [hinweis, setHinweis] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [lastNummer, setLastNummer] = useState(null);
  const [error, setError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [stornoNummer, setStornoNummer] = useState(null);
  const [suchNummer, setSuchNummer] = useState("");
  const [suchTreffer, setSuchTreffer] = useState(undefined);
  const [geschlossenPopup, setGeschlossenPopup] = useState(false);
  const [getraenkeGeschlossenPopup, setGetraenkeGeschlossenPopup] = useState(false);
  const verkaufstag = useVerkaufstag();

  const essenOffenCount = [1, 2, 3].filter((n) => einstellungen["ausgabe" + n]).length;
  const essenVerfuegbar = einstellungen.essenBesetzt && essenOffenCount > 0;
  const getraenkeVerfuegbar = einstellungen.getraenkeBesetzt;

  const vorherEssenVerfuegbar = useRef(essenVerfuegbar);
  useEffect(() => {
    if (vorherEssenVerfuegbar.current && !essenVerfuegbar) setGeschlossenPopup(true);
    vorherEssenVerfuegbar.current = essenVerfuegbar;
  }, [essenVerfuegbar]);
  const vorherGetraenkeVerfuegbar = useRef(getraenkeVerfuegbar);
  useEffect(() => {
    if (vorherGetraenkeVerfuegbar.current && !getraenkeVerfuegbar) setGetraenkeGeschlossenPopup(true);
    vorherGetraenkeVerfuegbar.current = getraenkeVerfuegbar;
  }, [getraenkeVerfuegbar]);

  useEffect(() => {
    if (lastNummer === null) return;
    const t = setTimeout(() => setLastNummer(null), 2600);
    return () => clearTimeout(t);
  }, [lastNummer]);

  const istAusverkauft = (a) => a.ausverkauft || (einstellungen.bestandsverwaltungAktiv && a.bestandVerfolgt !== false && (a.bestand || 0) <= 0);

  const changeQty = (a, delta) => {
    if (istAusverkauft(a)) return;
    setCart((prev) => {
      const next = { ...prev };
      const val = (next[a.id] || 0) + delta;
      if (val <= 0) delete next[a.id]; else next[a.id] = val;
      return next;
    });
  };

  const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
  const totalCostVorRabatt = Object.entries(cart).reduce((sum, [id, qty]) => {
    const a = artikel.find((x) => x.id === id);
    return sum + (a ? a.preis * qty : 0);
  }, 0);
  const rabattZahl = rabatt ? parseFloat(rabatt.replace(",", ".")) || 0 : 0;
  const totalCost = Math.max(0, totalCostVorRabatt - rabattZahl);
  const gegebenZahl = gegeben ? parseFloat(gegeben.replace(",", ".")) : null;
  const rueckgeld = gegebenZahl !== null && !isNaN(gegebenZahl) ? gegebenZahl - totalCost : null;

  const resetForm = () => { setCart({}); setGegeben(""); setRabatt(""); setPersonalverpflegung(false); setHinweis(""); setEditingId(null); };

  const bestandAnpassen = async (items, richtung) => {
    if (!einstellungen.bestandsverwaltungAktiv) return;
    const { doc, updateDoc, increment } = window.__fs;
    await Promise.all(items.filter((i) => {
      const a = artikel.find((x) => x.id === i.artikelId);
      return !a || a.bestandVerfolgt !== false;
    }).map((i) =>
      updateDoc(doc(window.__db, "artikel", i.artikelId), { bestand: increment(richtung * i.menge) }).catch(() => {})
    ));
  };

  const submit = async () => {
    if (totalItems === 0 || submitting) return;
    setSubmitting(true);
    setError("");
    try {
      const { collection, doc, addDoc, updateDoc, serverTimestamp } = window.__fs;
      const items = Object.entries(cart).map(([id, qty]) => {
        const a = artikel.find((x) => x.id === id);
        return { artikelId: id, name: a.name, kategorie: a.kategorie, preis: a.preis, menge: qty };
      });
      const hatEssen = items.some((i) => i.kategorie === "essen");
      const hatGetraenke = items.some((i) => i.kategorie === "alkoholfrei" || i.kategorie === "alkoholisch");

      if (editingId) {
        const bestehend = bestellungen.find((b) => b.id === editingId);
        let essenStatus = bestehend.essenStatus;
        let ausgabeNummer = bestehend.ausgabeNummer;
        if (!hatEssen) { essenStatus = "kein"; ausgabeNummer = null; }
        else if (essenStatus === "kein") { essenStatus = "wartend"; ausgabeNummer = null; }
        else if (essenStatus === "fertig") { essenStatus = ausgabeNummer ? "inBearbeitung" : "wartend"; }
        const betrafLaufendeBearbeitung = bestehend.essenStatus === "inBearbeitung" || (bestehend.hatGetraenke && !bestehend.getraenkeFertig);
        await bestandAnpassen(bestehend.items, 1);
        await bestandAnpassen(items, -1);
        await updateDoc(doc(window.__db, "bestellungen", editingId), {
          items, gesamtpreis: personalverpflegung ? 0 : totalCost, gesamtpreisVorRabatt: totalCostVorRabatt, rabattBetrag: rabattZahl,
          personalverpflegung, hatEssen, hatGetraenke,
          getraenkeFertig: hatGetraenke ? false : true,
          getraenkeFertigZeitMs: hatGetraenke ? null : (bestehend.getraenkeFertigZeitMs || null),
          getraenkeAbgeholt: false,
          essenStatus, ausgabeNummer, archiviert: false, essenAbgeholt: false,
          abschlussZeitMs: null,
          hinweis: hinweis.trim(), zahlungsart: "bar",
          ...(betrafLaufendeBearbeitung ? { bearbeitungsHinweisMs: Date.now() } : {}),
        });
        setLastNummer(bestehend.nummer);
      } else {
        const nummer = await naechsteBestellnummer();
        await addDoc(collection(window.__db, "bestellungen"), {
          nummer, items, gesamtpreis: personalverpflegung ? 0 : totalCost, gesamtpreisVorRabatt: totalCostVorRabatt, rabattBetrag: rabattZahl,
          personalverpflegung,
          gegeben: !personalverpflegung ? gegebenZahl : null,
          rueckgeld: !personalverpflegung ? rueckgeld : null,
          zahlungsart: "bar",
          hinweis: hinweis.trim(), hatEssen, hatGetraenke,
          getraenkeFertig: hatGetraenke ? false : true,
          getraenkeFertigZeitMs: null,
          essenStatus: hatEssen ? "wartend" : "kein",
          essenInBearbeitungZeitMs: null,
          essenFertigZeitMs: null,
          essenAbgeholt: false,
          getraenkeAbgeholt: false,
          viaHotkeyMs: null,
          ausgabeNummer: null,
          storniert: false, archiviert: false,
          abschlussZeitMs: null,
          erstelltAm: serverTimestamp(), erstelltAmMs: Date.now(),
        });
        await bestandAnpassen(items, -1);
        setLastNummer(nummer);
      }
      resetForm();
    } catch (e) {
      setError("Bestellung konnte nicht gesendet/gespeichert werden.");
    } finally {
      setSubmitting(false);
    }
  };

  const startEditOrder = (b) => {
    const neuerCart = {};
    b.items.forEach((i) => { neuerCart[i.artikelId] = i.menge; });
    setCart(neuerCart);
    setEditingId(b.id);
    setGegeben("");
    setRabatt(b.rabattBetrag ? String(b.rabattBetrag).replace(".", ",") : "");
    setPersonalverpflegung(!!b.personalverpflegung);
    setHinweis(b.hinweis || "");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const kannBearbeiten = (b) => !b.hatEssen || b.essenStatus === "wartend" || b.essenStatus === "inBearbeitung";

  const stornieren = async (b) => {
    const { doc, updateDoc } = window.__fs;
    await updateDoc(doc(window.__db, "bestellungen", b.id), { storniert: true });
    await bestandAnpassen(b.items, 1);
    setStornoNummer(b.nummer);
    if (editingId === b.id) resetForm();
  };

  const aktive = bestellungen.filter(istAktiv).sort((a, b) => (b.erstelltAmMs || 0) - (a.erstelltAmMs || 0));
  const chronik = bestellungen
    .filter((b) => (b.erstelltAmMs || 0) >= (verkaufstag.tagStartMs || 0))
    .slice().sort((a, b) => (b.erstelltAmMs || 0) - (a.erstelltAmMs || 0));

  const suchen = () => {
    const n = parseInt(suchNummer, 10);
    if (isNaN(n)) { setSuchTreffer(null); return; }
    const treffer = bestellungen.filter((b) => b.nummer === n).sort((a, b) => (b.erstelltAmMs || 0) - (a.erstelltAmMs || 0))[0];
    setSuchTreffer(treffer || null);
  };

  const renderKategorieBlock = (kat) => {
    const items = artikel.filter((a) => a.kategorie === kat.id);
    if (items.length === 0) return null;
    const istGetraenkeKat = kat.id === "alkoholfrei" || kat.id === "alkoholisch";
    const verfuegbar = kat.id === "essen" ? essenVerfuegbar : (istGetraenkeKat ? getraenkeVerfuegbar : true);
    return (
      <div key={kat.id} style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <h2 style={{ fontSize: 15 }}>{kat.label}</h2>
          {kat.id === "essen" && (
            <span className={"stat-pill" + (essenOffenCount === 0 ? " warn" : "")}>{essenOffenCount} von 3 Ausgaben geöffnet</span>
          )}
        </div>
        {!verfuegbar ? (
          <div className="gesperrt-block">
            {kat.id === "essen" ? "Essensausgabe aktuell nicht besetzt" : "Getränkeausgabe aktuell nicht besetzt"}
          </div>
        ) : (
          <div className="grid">
            {items.map((a) => (
              <div className={"card" + (istAusverkauft(a) ? " ausverkauft" : "")} key={a.id}>
                <div>{a.name}</div>
                {istAusverkauft(a) ? <div className="ausverkauft-tag">Ausverkauft</div> : (
                  <>
                    <div className="price">{a.preis.toFixed(2)} €</div>
                    {einstellungen.bestandsverwaltungAktiv && a.bestandVerfolgt !== false && <div className="price">Noch {a.bestand || 0}</div>}
                  </>
                )}
                <div className="stepper">
                  <button onClick={() => changeQty(a, -1)} disabled={!cart[a.id] || istAusverkauft(a)}>-</button>
                  <span className="qty">{cart[a.id] || 0}</span>
                  <button onClick={() => changeQty(a, 1)} disabled={istAusverkauft(a)}>+</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  if (!entsperrt) {
    return (
      <div className="wrap">
        <h1 className="page-title">Kasse gesperrt</h1>
        <p style={{ color: "var(--muted)", fontSize: 13 }}>Bitte Passwort eingeben, um auf die Kasse zuzugreifen.</p>
        <div className="row-form">
          <input type="password" placeholder="Passwort" value={kassePwInput}
            onChange={(e) => setKassePwInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && (kassePwInput === KASSE_PASSWORT ? setEntsperrt(true) : setKassePwError("Falsches Passwort."))}
            style={{ width: 180 }} />
          <button className="btn" onClick={() => (kassePwInput === KASSE_PASSWORT ? setEntsperrt(true) : setKassePwError("Falsches Passwort."))}>Entsperren</button>
          {kassePwError && <span style={{ color: "var(--rust)", fontSize: 13 }}>{kassePwError}</span>}
        </div>
      </div>
    );
  }

  return (
    <div className="wrap">
      <InfoModal title={stornoNummer != null ? "Bestellung Nr. " + stornoNummer + " storniert" : null}
        message="Die Bestellung wurde storniert und erscheint nicht mehr auf den Monitoren."
        onClose={() => setStornoNummer(null)} />
      <InfoModal title={geschlossenPopup ? "Essensausgabe aktuell nicht verfügbar" : null}
        message="Es ist aktuell keine Ausgabe für Essen geöffnet bzw. besetzt. Essensbestellungen können momentan nicht aufgenommen werden."
        onClose={() => setGeschlossenPopup(false)} />
      <InfoModal title={getraenkeGeschlossenPopup ? "Getränkeausgabe aktuell nicht verfügbar" : null}
        message="Es ist aktuell keine Getränkeausgabe besetzt. Getränkebestellungen können momentan nicht aufgenommen werden."
        onClose={() => setGetraenkeGeschlossenPopup(false)} />

      <h1 className="page-title">Kasse</h1>

      {editingId && (
        <div className="editing-banner">
          <span>Bestellung wird bearbeitet — Änderungen speichern oder abbrechen.</span>
          <button className="del" onClick={resetForm} style={{ color: "#8A6416" }}>Abbrechen</button>
        </div>
      )}

      {lastNummer !== null && (
        <p style={{ background: "var(--green)", color: "#fff", padding: "8px 12px", borderRadius: 9, display: "inline-block" }}>
          Bestellung Nr. {lastNummer} {editingId ? "aktualisiert" : "gesendet"}
        </p>
      )}
      {error && <p style={{ color: "var(--rust)" }}>{error}</p>}
      {!ready && <p>Verbinde mit Firebase…</p>}
      {ready && artikel.length === 0 && <p style={{ color: "var(--muted)" }}>Noch keine Artikel angelegt — zuerst in der Artikelverwaltung eintragen.</p>}

      {KATEGORIEN.map(renderKategorieBlock)}

      <div className="bar">
        <span>
          <b>{totalItems}</b> Artikel — <b>{personalverpflegung ? "0,00" : totalCost.toFixed(2)} €</b>
          {!personalverpflegung && rabattZahl > 0 && <span style={{ color: "var(--muted)", fontSize: 12 }}> (statt {totalCostVorRabatt.toFixed(2)} €)</span>}
          {personalverpflegung && <span style={{ color: "var(--led-amber)", fontSize: 12 }}> (Personalverpflegung)</span>}
        </span>
        <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}>
          <input type="checkbox" checked={personalverpflegung} onChange={(e) => setPersonalverpflegung(e.target.checked)} />
          Personalverpflegung (0 €)
        </label>
        {!personalverpflegung && (
          <div className="rueckgeld-row">
            <label htmlFor="rabatt">Rabatt €:</label>
            <input id="rabatt" value={rabatt} onChange={(e) => setRabatt(e.target.value)} placeholder="0,00" style={{ width: 70 }} />
          </div>
        )}
        {!personalverpflegung && (
          <div className="rueckgeld-row">
            <label htmlFor="gegeben">Gegeben:</label>
            <input id="gegeben" value={gegeben} onChange={(e) => setGegeben(e.target.value)} placeholder="0,00" />
            {rueckgeld !== null && !isNaN(rueckgeld) && (
              <span>Rückgeld: <b>{rueckgeld.toFixed(2)} €</b></span>
            )}
          </div>
        )}
        <button className="btn" onClick={submit} disabled={totalItems === 0 || submitting}>
          {submitting ? "Sende…" : editingId ? "Änderungen speichern" : "Bestellung senden"}
        </button>
        <div className="hinweis-row">
          <input placeholder="Hinweis für die Küche (z.B. ohne Zwiebeln)" value={hinweis} onChange={(e) => setHinweis(e.target.value)} />
        </div>
      </div>

      <h2 className="section-title">Aktuelle Bestellungen</h2>
      {aktive.length === 0 && <p style={{ color: "var(--muted)", fontSize: 13 }}>Keine offenen Bestellungen.</p>}
      {aktive.map((b) => (
        <div className="order-row" key={b.id}>
          <span><b>Nr. {b.nummer}</b> — {b.gesamtpreis.toFixed(2)} € <span className="meta">· {orderStatusText(b)} · Gesamt: {gesamtStatusLabel(gesamtStatus(b))}</span></span>
          <span className="order-actions">
            {kannBearbeiten(b) && <button className="edit-link" onClick={() => startEditOrder(b)}>Bearbeiten</button>}
            <button className="del" onClick={() => stornieren(b)}>Stornieren</button>
          </span>
        </div>
      ))}

      <h2 className="section-title">Bestellung erneut aufrufen</h2>
      <div className="row-form">
        <input placeholder="Bestellnummer" value={suchNummer} onChange={(e) => setSuchNummer(e.target.value)} style={{ width: 130 }} onKeyDown={(e) => e.key === "Enter" && suchen()} />
        <button className="btn secondary" onClick={suchen}>Suchen</button>
      </div>
      {suchTreffer === null && <p style={{ color: "var(--rust)", fontSize: 13 }}>Keine Bestellung mit dieser Nummer gefunden.</p>}
      {suchTreffer && (
        <div className="order-row">
          <span>
            <b>Nr. {suchTreffer.nummer}</b> — {suchTreffer.gesamtpreis.toFixed(2)} € <span className="meta">· {orderStatusText(suchTreffer)} · Gesamt: {gesamtStatusLabel(gesamtStatus(suchTreffer))}</span>
            <br /><span className="meta">{suchTreffer.items.map((i) => i.menge + "× " + i.name).join(", ")}</span>
            <br /><span className="meta">{formatZeitstempel(suchTreffer)}</span>
          </span>
          {istAktiv(suchTreffer) && (
            <span className="order-actions">
              {kannBearbeiten(suchTreffer) && <button className="edit-link" onClick={() => startEditOrder(suchTreffer)}>Bearbeiten</button>}
              <button className="del" onClick={() => stornieren(suchTreffer)}>Stornieren</button>
            </span>
          )}
        </div>
      )}

      <h2 className="section-title">Chronik</h2>
      <p style={{ color: "var(--muted)", fontSize: 13, marginTop: -4 }}>Die letzten Bestellungen, unabhängig vom Status.</p>
      {chronik.length === 0 && <p style={{ color: "var(--muted)", fontSize: 13 }}>Noch keine Bestellungen.</p>}
      {chronik.map((b) => (
        <div className="order-row" key={b.id}>
          <span>
            <b>Nr. {b.nummer}</b> — {b.gesamtpreis.toFixed(2)} € <span className="meta">· {orderStatusText(b)}</span>
            <br /><span className="meta">{b.items.map((i) => i.menge + "× " + i.name).join(", ")}</span>
          </span>
        </div>
      ))}
    </div>
  );
}

function MonitorGetraenke() {
  const { bestellungen } = useBestellungen();
  const einstellungen = useEinstellungen();
  const [now, setNow] = useState(Date.now());
  const [banner, setBanner] = useState([]);
  const gesehenRef = useRef({});
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    bestellungen.forEach((b) => {
      if (!b.bearbeitungsHinweisMs) return;
      if (gesehenRef.current[b.id] === b.bearbeitungsHinweisMs) return;
      if (Date.now() - b.bearbeitungsHinweisMs > 10000) { gesehenRef.current[b.id] = b.bearbeitungsHinweisMs; return; }
      gesehenRef.current[b.id] = b.bearbeitungsHinweisMs;
      const bannerId = b.id + "-" + b.bearbeitungsHinweisMs;
      setBanner((prev) => [...prev, { id: bannerId, nummer: b.nummer }]);
      setTimeout(() => setBanner((prev) => prev.filter((x) => x.id !== bannerId)), 10000);
    });
  }, [bestellungen]);

  const offen = useMemo(() => {
    return bestellungen
      .filter((b) => istAktiv(b) && b.hatGetraenke && !b.getraenkeFertig)
      .sort((a, b) => {
        const wartetA = a.hatEssen && !a.ausgabeNummer ? 1 : 0;
        const wartetB = b.hatEssen && !b.ausgabeNummer ? 1 : 0;
        if (wartetA !== wartetB) return wartetA - wartetB;
        return (a.erstelltAmMs || 0) - (b.erstelltAmMs || 0);
      });
  }, [bestellungen]);

  // Bei Mix-Bestellungen (Essen + Getränke) sind die Getränke evtl. schon
  // fertig, warten aber noch auf die Abholung am Getränkestand.
  const wartetAufAbholung = useMemo(() => {
    return bestellungen
      .filter((b) => istAktiv(b) && b.hatGetraenke && b.getraenkeFertig && !b.getraenkeAbgeholt)
      .sort((a, b) => (a.getraenkeFertigZeitMs || 0) - (b.getraenkeFertigZeitMs || 0));
  }, [bestellungen]);

  const markFertig = async (b) => {
    await updateUndPruefeArchivierung(b, { getraenkeFertig: true, getraenkeFertigZeitMs: Date.now() });
  };
  const markGetraenkeAbgeholt = async (b) => {
    await updateUndPruefeArchivierung(b, { getraenkeAbgeholt: true });
  };

  return (
    <div className="monitor">
      <Nav current="monitor-getraenke" />
      {banner.length > 0 && (
        <div className="banner-stack">
          {banner.map((x) => (
            <div className="update-banner" key={x.id}>Bestellung {x.nummer} wurde aktualisiert</div>
          ))}
        </div>
      )}
      <div className="wrap">
        <div className="mon-head">
          <h1>Getränke</h1>
          <div className="mon-controls">
            <span className="led-box led-amber">{offen.length} offen</span>
            <button className={"hotkey-btn" + (!einstellungen.getraenkeBesetzt ? " aktiv-warnung" : "")}
              onClick={() => setEinstellung({ getraenkeBesetzt: !einstellungen.getraenkeBesetzt })}>
              {einstellungen.getraenkeBesetzt ? "Ausgabe nicht besetzt melden" : "Ausgabe wieder besetzt melden"}
            </button>
            <FullscreenToggle />
          </div>
        </div>
        {offen.length === 0 && wartetAufAbholung.length === 0 && <div className="empty">Keine offenen Bestellungen</div>}
        <div className="ausgaben-grid">
          {offen.map((b) => {
            const elapsed = now - (b.erstelltAmMs || Date.now());
            const cls = zeitKlasse(elapsed);
            return (
              <div className="ausgabe-tile belegt" key={b.id}>
                <div className="ausgabe-tile-head">
                  <span className="ausgabe-tile-num">Nr. {b.nummer}</span>
                  <span className={"ausgabe-tile-time " + cls}>{formatElapsed(elapsed)}</span>
                </div>
                {b.hatEssen && (b.ausgabeNummer
                  ? <span className="ausgabe-badge">Ausgabe {b.ausgabeNummer}</span>
                  : <span className="ausgabe-wait">wartet auf Ausgabe</span>)}
                {b.personalverpflegung && <span className="personal-badge">Personalbestellung</span>}
                <ul className="t-items">
                  {b.items.filter((i) => i.kategorie === "alkoholfrei" || i.kategorie === "alkoholisch").map((i, idx) => (
                    <li key={idx}><b>{i.menge}×</b>{i.name}</li>
                  ))}
                </ul>
                {b.hinweis && <p className="t-hinweis">{b.hinweis}</p>}
                <button className="ready-btn" onClick={() => markFertig(b)}>Als fertig markieren</button>
              </div>
            );
          })}
          {wartetAufAbholung.map((b) => (
            <div className="ausgabe-tile belegt fertig-gruen" key={b.id}>
              <div className="ausgabe-tile-head">
                <span className="ausgabe-tile-num">Nr. {b.nummer}</span>
              </div>
              {b.hatEssen && (b.ausgabeNummer
                ? <span className="ausgabe-badge">Ausgabe {b.ausgabeNummer}</span>
                : <span className="ausgabe-wait">wartet auf Ausgabe</span>)}
              {b.personalverpflegung && <span className="personal-badge">Personalbestellung</span>}
              <ul className="t-items">
                {b.items.filter((i) => i.kategorie === "alkoholfrei" || i.kategorie === "alkoholisch").map((i, idx) => (
                  <li key={idx}><b>{i.menge}×</b>{i.name}</li>
                ))}
              </ul>
              {b.hinweis && <p className="t-hinweis">{b.hinweis}</p>}
              <button className="ready-btn sage" onClick={() => markGetraenkeAbgeholt(b)}>Abgeholt</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MonitorEssen() {
  const { bestellungen, ready } = useBestellungen();
  const einstellungen = useEinstellungen();
  useAusgabenZuweisung(bestellungen, ready, einstellungen);
  const [now, setNow] = useState(Date.now());
  const [warnung, setWarnung] = useState(null);
  const [banner, setBanner] = useState([]);
  const gesehenRef = useRef({});
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  const aktiv = useMemo(() => bestellungen.filter((b) => istAktiv(b) && b.hatEssen && b.essenStatus !== "kein" && !b.essenAbgeholt), [bestellungen]);

  // Banner-Hinweis: wenn eine Bestellung im Status "in Bearbeitung" nachträglich
  // von der Kasse geändert wurde, kurz auffällig anzeigen, damit das Essensteam
  // die Änderung an einer bereits laufenden Bestellung mitbekommt.
  useEffect(() => {
    bestellungen.forEach((b) => {
      if (!b.bearbeitungsHinweisMs) return;
      if (gesehenRef.current[b.id] === b.bearbeitungsHinweisMs) return;
      if (Date.now() - b.bearbeitungsHinweisMs > 10000) { gesehenRef.current[b.id] = b.bearbeitungsHinweisMs; return; }
      gesehenRef.current[b.id] = b.bearbeitungsHinweisMs;
      const bannerId = b.id + "-" + b.bearbeitungsHinweisMs;
      setBanner((prev) => [...prev, { id: bannerId, nummer: b.nummer }]);
      setTimeout(() => setBanner((prev) => prev.filter((x) => x.id !== bannerId)), 10000);
    });
  }, [bestellungen]);

  const wartendeListe = useMemo(() =>
    aktiv.filter((b) => b.essenStatus === "wartend").sort((a, b) => (a.erstelltAmMs || 0) - (b.erstelltAmMs || 0)),
    [aktiv]
  );

  const markFertig = async (b) => {
    const { doc, updateDoc } = window.__fs;
    await updateDoc(doc(window.__db, "bestellungen", b.id), { essenStatus: "fertig", essenFertigZeitMs: Date.now() });
  };
  const markAbgeholt = async (b) => {
    await updateUndPruefeArchivierung(b, { essenAbgeholt: true, abschlussZeitMs: Date.now() });
  };
  // Für Bestellungen, die noch "wartend" sind (keiner Ausgabe zugeteilt),
  // aber schon fertig zubereitet wurden — z.B. wenn das Grillteam mit
  // Bratwürsten schneller ist als mit den zugeteilten Steaks.
  const markFertigUndAbgeholt = async (b) => {
    const jetzt = Date.now();
    await updateUndPruefeArchivierung(b, {
      essenStatus: "fertig", essenFertigZeitMs: jetzt, essenAbgeholt: true, abschlussZeitMs: jetzt, viaHotkeyMs: jetzt,
    });
  };

  const toggleAusgabe = async (n) => {
    const key = "ausgabe" + n;
    const wirdAusgeschaltet = einstellungen[key];
    if (wirdAusgeschaltet) {
      const hatAktive = aktiv.some((b) => b.ausgabeNummer === n && (b.essenStatus === "inBearbeitung" || b.essenStatus === "fertig"));
      if (hatAktive) {
        setWarnung("Es befindet sich noch eine aktive Bestellung am zu schließenden Ausgabebereich. Nach Fertigstellung und Abholung der Bestellung, werden keine weiteren Bestellungen auf die ausgewählte Ausgabe gebucht.");
      }
    }
    await setEinstellung({ [key]: !wirdAusgeschaltet });
  };

  return (
    <div className="monitor">
      <Nav current="monitor-essen" />
      <InfoModal title={warnung ? "Ausgabe wird geschlossen" : null} message={warnung} onClose={() => setWarnung(null)} />
      {banner.length > 0 && (
        <div className="banner-stack">
          {banner.map((x) => (
            <div className="update-banner" key={x.id}>Bestellung {x.nummer} wurde aktualisiert</div>
          ))}
        </div>
      )}
      <div className="wrap">
        <div className="mon-head">
          <h1>Essen / Grill</h1>
          <div className="mon-controls">
            <span className="led-box led-amber">{aktiv.length} offen</span>
            <button className={"hotkey-btn" + (!einstellungen.essenBesetzt ? " aktiv-warnung" : "")}
              onClick={() => setEinstellung({ essenBesetzt: !einstellungen.essenBesetzt })}>
              {einstellungen.essenBesetzt ? "Ausgabe nicht besetzt melden" : "Ausgabe wieder besetzt melden"}
            </button>
            <FullscreenToggle />
          </div>
        </div>

        <div className="ausgaben-grid">
          {[1, 2, 3].map((n) => {
            const offen = einstellungen["ausgabe" + n];
            const order = aktiv.find((b) => b.ausgabeNummer === n && (b.essenStatus === "inBearbeitung" || b.essenStatus === "fertig"));
            if (!order && !offen) {
              return (
                <div className="ausgabe-tile geschlossen" key={n}>
                  <span className="ausgabe-tile-nr">Ausgabe {n} — geschlossen</span>
                  <button className="ausgabe-toggle" onClick={() => toggleAusgabe(n)}>Öffnen</button>
                </div>
              );
            }
            if (!order) {
              return (
                <div className="ausgabe-tile frei" key={n}>
                  <span className="ausgabe-tile-nr">Ausgabe {n} — frei</span>
                  <button className="ausgabe-toggle on" onClick={() => toggleAusgabe(n)}>Offen</button>
                </div>
              );
            }
            const istFertig = order.essenStatus === "fertig";
            // Timer zeigt die Zeit im aktuellen Status, nicht seit Bestelleingang —
            // startet also bei jedem Statuswechsel wieder bei 0.
            const statusStart = istFertig
              ? (order.essenFertigZeitMs || order.erstelltAmMs || Date.now())
              : (order.essenInBearbeitungZeitMs || order.erstelltAmMs || Date.now());
            const elapsed = now - statusStart;
            const cls = istFertig ? "" : zeitKlasse(elapsed);
            return (
              <div className={"ausgabe-tile belegt" + (istFertig ? " fertig-gruen" : cls ? " " + cls : "")} key={n}>
                <div className="ausgabe-tile-head">
                  <span className="ausgabe-tile-nr">Ausgabe {n}{!offen ? " (schließt nach Abholung)" : ""}</span>
                  <button className={"ausgabe-toggle" + (offen ? " on" : "")} onClick={() => toggleAusgabe(n)}>{offen ? "Offen" : "Geschlossen"}</button>
                </div>
                <div className="ausgabe-tile-head">
                  <span className="ausgabe-tile-num">Nr. {order.nummer}</span>
                  <span className={"ausgabe-tile-time " + cls}>{formatElapsed(elapsed)}</span>
                </div>
                {order.personalverpflegung && <span className="personal-badge">Personalbestellung</span>}
                <ul className="t-items">
                  {order.items.filter((i) => i.kategorie === "essen").map((i, idx) => (
                    <li key={idx}><b>{i.menge}×</b>{i.name}</li>
                  ))}
                </ul>
                {order.hinweis && <p className="t-hinweis">{order.hinweis}</p>}
                {order.essenStatus === "inBearbeitung" && (
                  <button className="ready-btn" onClick={() => markFertig(order)}>Als fertig markieren</button>
                )}
                {order.essenStatus === "fertig" && (
                  <button className="ready-btn sage" onClick={() => markAbgeholt(order)}>Abgeholt</button>
                )}
              </div>
            );
          })}
        </div>

        {wartendeListe.length > 0 && (
          <>
            <h2 style={{ fontSize: 14, color: "var(--mon-muted)", margin: "4px 0 10px" }}>Warteschlange ({wartendeListe.length})</h2>
            <div className="queue-row">
              {wartendeListe.map((b) => {
                const elapsed = now - (b.erstelltAmMs || Date.now());
                return (
                  <div className="queue-tile" key={b.id}>
                    <div className="q-nr">Nr. {b.nummer}</div>
                    <div className="q-time">wartet seit {formatElapsed(elapsed)}</div>
                    {b.personalverpflegung && <span className="personal-badge">Personalbestellung</span>}
                    <ul>
                      {b.items.filter((i) => i.kategorie === "essen").map((i, idx) => (
                        <li key={idx}>{i.menge}× {i.name}</li>
                      ))}
                    </ul>
                    {b.hinweis && <p className="t-hinweis" style={{ fontSize: 11 }}>{b.hinweis}</p>}
                    <button className="ready-btn sage klein" onClick={() => markFertigUndAbgeholt(b)}>Fertig &amp; abgeholt</button>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function Ausgabemonitor() {
  const { bestellungen, ready } = useBestellungen();
  const einstellungen = useEinstellungen();
  useAusgabenZuweisung(bestellungen, ready, einstellungen);

  // Bereit zur Abholung heißt: Essen fertig UND (falls vorhanden) auch die
  // Getränke fertig — nicht schon, wenn nur das Essen fertig ist.
  const bereitZurAbholung = (b) => b.essenStatus === "fertig" && (!b.hatGetraenke || b.getraenkeFertig);
  const wartetAufGetraenke = (b) => b.essenStatus === "fertig" && b.hatGetraenke && !b.getraenkeFertig;
  const anzeigeStatus = (b) => bereitZurAbholung(b) ? "fertig" : wartetAufGetraenke(b) ? "wartetGetraenke" : b.essenStatus;
  const anzeigeLabel = (s) => s === "wartetGetraenke" ? "Wartet auf Getränke" : essenStatusLabel(s);

  const { sichtbar, weitereWartend } = useMemo(() => {
    const aktiv = bestellungen.filter((b) => istAktiv(b) && b.hatEssen && !b.essenAbgeholt);
    const fertig = aktiv.filter((b) => bereitZurAbholung(b))
      .sort((a, b) => (a.essenFertigZeitMs || a.erstelltAmMs || 0) - (b.essenFertigZeitMs || b.erstelltAmMs || 0));
    const wartetGetraenke = aktiv.filter((b) => wartetAufGetraenke(b))
      .sort((a, b) => (a.essenFertigZeitMs || a.erstelltAmMs || 0) - (b.essenFertigZeitMs || b.erstelltAmMs || 0));
    const inBearbeitung = aktiv.filter((b) => b.essenStatus === "inBearbeitung")
      .sort((a, b) => (a.ausgabeNummer || 99) - (b.ausgabeNummer || 99));
    const wartend = aktiv.filter((b) => b.essenStatus === "wartend")
      .sort((a, b) => (a.erstelltAmMs || 0) - (b.erstelltAmMs || 0));
    const wartendSichtbar = wartend.slice(0, 3);
    return {
      sichtbar: [...fertig, ...wartetGetraenke, ...inBearbeitung, ...wartendSichtbar],
      weitereWartend: Math.max(0, wartend.length - wartendSichtbar.length),
    };
  }, [bestellungen]);

  const kacheln = useMemo(() => {
    const gewicht = (b) => (bereitZurAbholung(b) ? 2.2 : 1);
    const gesamtgewicht = sichtbar.reduce((s, b) => s + gewicht(b), 0) || 1;
    const verfuegbareHoeheVh = 84;
    const abstandVh = sichtbar.length > 1 ? (sichtbar.length - 1) * 0.7 : 0;
    const nutzbareHoeheVh = Math.max(8, verfuegbareHoeheVh - abstandVh);
    return sichtbar.map((b) => {
      const hoeheVh = (gewicht(b) / gesamtgewicht) * nutzbareHoeheVh;
      return { b, hoeheVh, gross: bereitZurAbholung(b) };
    });
  }, [sichtbar]);

  return (
    <div className="monitor">
      <Nav current="ausgabemonitor" />
      <div className="wrap" style={{ maxWidth: "100%", padding: "16px 0" }}>
        <div className="mon-head" style={{ padding: "0 1.2vw" }}>
          <h1>Ausgabemonitor</h1>
          <div className="mon-controls">
            <span className="led-box led-amber">{sichtbar.length} angezeigt{weitereWartend > 0 ? " · +" + weitereWartend + " warten" : ""}</span>
            <FullscreenToggle />
          </div>
        </div>
        {sichtbar.length === 0 && <div className="empty">Keine offenen Bestellungen</div>}
        <div className="ausgabe-fullscreen">
          {kacheln.map(({ b, hoeheVh, gross }) => {
            const nummerFont = Math.min(9, Math.max(2.2, hoeheVh * 0.34));
            const ausgabeFont = Math.min(7, Math.max(1.8, hoeheVh * 0.26));
            const statusFont = Math.min(3, Math.max(1.2, hoeheVh * 0.14));
            const status = anzeigeStatus(b);
            return (
              <div key={b.id} className={"ausgabe-tile-full" + (gross ? " gross" : "") + (status === "fertig" ? " fertig-gruen" : "")} style={{ height: hoeheVh + "vh" }}>
                <div className="links">
                  <span style={{ fontSize: ausgabeFont + "vh", color: "var(--mon-muted)", fontFamily: "'Poppins', sans-serif", fontWeight: 700 }}>
                    {b.ausgabeNummer ? "Ausgabe " + b.ausgabeNummer : "–"}
                  </span>
                  <span style={{ fontSize: nummerFont + "vh", color: "var(--mon-text)", fontFamily: "'Poppins', sans-serif", fontWeight: 700 }}>
                    Nr. {b.nummer}
                  </span>
                </div>
                <span className={"status-tag status-" + (status === "wartetGetraenke" ? "inBearbeitung" : status)} style={{ fontSize: statusFont + "vh" }}>
                  {anzeigeLabel(status)}
                </span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Kundenanzeige() {
  const { bestellungen, ready } = useBestellungen();
  const [qrSvg, setQrSvg] = useState("");

  // Neueste, nicht stornierte und nicht als Personalverpflegung markierte
  // Bestellung — läuft über Firestore und funktioniert damit auf jedem
  // Gerät, nicht nur im selben Browser wie die Kasse.
  const bestellung = useMemo(() => {
    const kandidaten = bestellungen.filter((b) => !b.storniert && !b.personalverpflegung);
    if (kandidaten.length === 0) return null;
    return kandidaten.reduce((neuste, b) => ((b.erstelltAmMs || 0) > (neuste.erstelltAmMs || 0) ? b : neuste));
  }, [bestellungen]);

  useEffect(() => {
    if (!bestellung) { setQrSvg(""); return; }
    setQrSvg(erzeugeQrSvg(belegText(bestellung), 6));
  }, [bestellung]);

  return (
    <div className="monitor">
      <Nav current="kundenanzeige" />
      <div className="wrap" style={{ textAlign: "center", paddingTop: "4vh" }}>
        {!ready && <p>Verbinde mit Firebase…</p>}
        {ready && !bestellung && (
          <div className="empty">Warte auf die nächste Bestellung …</div>
        )}
        {bestellung && (
          <>
            <div style={{ fontSize: "7vh", fontFamily: "'Poppins', sans-serif", fontWeight: 700, color: "var(--mon-text)", marginBottom: "2vh" }}>
              Nr. {bestellung.nummer}
            </div>
            <div
              style={{ display: "inline-block", background: "#fff", padding: 16, borderRadius: 16 }}
              dangerouslySetInnerHTML={{ __html: qrSvg }}
            />
            <div style={{ marginTop: "3vh", fontSize: 18, color: "var(--mon-muted)" }}>
              {bestellung.items.map((i, idx) => (
                <div key={idx}>{i.menge}× {i.name}</div>
              ))}
              <div style={{ marginTop: 10, fontWeight: 700, color: "var(--mon-text)", fontSize: 24 }}>
                {bestellung.gesamtpreis.toFixed(2)} €
              </div>
              {bestellung.hinweis && <div style={{ marginTop: 6, color: "var(--rust)", fontWeight: 700 }}>{bestellung.hinweis}</div>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function App() {
  const ready = useFirebaseReady();
  useMitternachtsReset(ready);
  const [route, setRoute] = useState(window.location.hash.replace("#", "") || "kasse");
  useEffect(() => {
    const onHash = () => setRoute(window.location.hash.replace("#", "") || "kasse");
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  if (route === "monitor-getraenke") return <MonitorGetraenke />;
  if (route === "monitor-essen") return <MonitorEssen />;
  if (route === "ausgabemonitor") return <Ausgabemonitor />;
  if (route === "kundenanzeige") return <Kundenanzeige />;

  return (
    <div>
      <Nav current={route} />
      {route === "artikel" ? <Artikelverwaltung /> : route === "kassenbuch" ? <Kassenbuch /> : <Kasse />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
